---
- name: "Base Server Configuration & Hardening"
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Ensure SSH connectivity and gather basic host info
      ansible.builtin.debug:
        msg: "Connected successfully to {{ inventory_hostname }} ({{ ansible_host }}) running {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Set system timezone to UTC
      community.general.timezone:
        name: "{{ system_timezone | default('UTC') }}"
      when: ansible_os_family == 'Debian'

    - name: Update apt cache and upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: "dist"
        cache_valid_time: 3600

    - name: Install foundational packages & system utilities
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - htop
          - ufw
          - unzip
          - zip
          - build-essential
          - ca-certificates
          - gnupg
          - software-properties-common
          - python3-pip
          - python3-setuptools
          - net-tools
        state: present

    - name: Check if swap space already exists
      ansible.builtin.command: swapon --show
      register: swap_status
      changed_when: false

    - name: Create 2GB swap file to prevent Out-Of-Memory (OOM) during builds
      when: swap_status.stdout == ""
      block:
        - name: Allocate swap file space
          ansible.builtin.command: fallocate -l 2G /swapfile
          args:
            creates: /swapfile

        - name: Set correct permissions on swapfile
          ansible.builtin.file:
            path: /swapfile
            owner: root
            group: root
            mode: "0600"

        - name: Format swapfile
          ansible.builtin.command: mkswap /swapfile
          when: swap_status.stdout == ""

        - name: Enable swapfile
          ansible.builtin.command: swapon /swapfile
          when: swap_status.stdout == ""

        - name: Add swapfile to /etc/fstab for persistence
          ansible.builtin.mount:
            name: none
            src: /swapfile
            fstype: swap
            opts: sw
            state: present

    - name: Set swappiness level
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        reload: true

    - name: Ensure SSH port is permitted in UFW before enabling
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable UFW firewall with default incoming deny
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Allow all outgoing connections by default in UFW
      community.general.ufw:
        direction: outgoing
        default: allow

