---
- name: "Automated Incident Recovery & Self-Healing for Ledger AI Services"
  hosts: app_servers
  become: true
  vars:
    app_user: "ubuntu"
    app_name: "ledger-ai"
    app_directory: "/var/www/ledger-ai"

  tasks:
    - name: Terminate any rogue CPU stress processes
      ansible.builtin.command: killall -9 stress-ng
      failed_when: false
      changed_when: false

    # --- Recover Web Server (Nginx) ---
    - name: Ensure Nginx configuration is valid
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Restart and ensure Nginx service is running
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

    # --- Recover Application Runtime (PM2) ---
    - name: Check current PM2 process list
      ansible.builtin.command: su - {{ app_user }} -c "pm2 list"
      register: pm2_output
      changed_when: false

    - name: Restart Ledger AI process via PM2
      ansible.builtin.command: pm2 restart {{ app_name }} --update-env
      args:
        chdir: "{{ app_directory }}"
      become_user: "{{ app_user }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
      when: "'online' not in pm2_output.stdout"

    - name: Reload or start application if not running
      ansible.builtin.command: pm2 startOrReload ecosystem.config.js --update-env
      args:
        chdir: "{{ app_directory }}"
      become_user: "{{ app_user }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"

    - name: Persist recovered PM2 state across system boots
      ansible.builtin.command: pm2 save
      become_user: "{{ app_user }}"
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"

    # --- Validate Recovery Health ---
    - name: Wait for internal application port 3000 to respond
      ansible.builtin.wait_for:
        port: 3000
        host: 127.0.0.1
        delay: 2
        timeout: 30

    - name: Query Nginx HTTP root endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: 200
        timeout: 10
      register: http_res

    - name: Query application health endpoint (/health)
      ansible.builtin.uri:
        url: "http://127.0.0.1/health"
        status_code: 200
        timeout: 10
      register: health_res

    - name: Recovery Success Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "RECOVERY COMPLETED SUCCESSFULLY!"
          - "Nginx Status: Active & Serving HTTP 200"
          - "PM2 Status: '{{ app_name }}' is Online and healthy"
          - "Health Endpoint Response: {{ health_res.status }}"
          - "Nagios will update all service alerts to OK (Green)!"
          - "=========================================================="

