---
# --- Part 1: Configure NRPE Agent on Ledger App Server ---
- name: "Configure NRPE Agent and Health Checks on Ledger App Server"
  hosts: app_servers
  become: true
  vars:
    monitoring_server_ip: "{{ hostvars[groups['monitoring_servers'][0]]['private_ip'] | default(hostvars[groups['monitoring_servers'][0]]['ansible_host']) }}"

  tasks:
    - name: Allow NRPE (Port 5666) in UFW
      community.general.ufw:
        rule: allow
        port: "5666"
        proto: tcp

    - name: Install NRPE server and standard plugins
      ansible.builtin.apt:
        name:
          - nagios-nrpe-server
          - nagios-plugins
          - nagios-plugins-basic
          - nagios-plugins-standard
        state: present
        update_cache: true

    - name: Deploy custom RAM usage monitoring script
      ansible.builtin.copy:
        src: ../templates/check_mem.sh
        dest: /usr/local/bin/check_mem.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy custom PM2 status monitoring script
      ansible.builtin.copy:
        src: ../templates/check_pm2.sh
        dest: /usr/local/bin/check_pm2.sh
        owner: root
        group: root
        mode: "0755"

    - name: Whitelist Nagios Server IP in nrpe.cfg
      ansible.builtin.lineinfile:
        path: /etc/nagios/nrpe.cfg
        regexp: "^allowed_hosts="
        line: "allowed_hosts=127.0.0.1,::1,{{ monitoring_server_ip }},{{ hostvars[groups['monitoring_servers'][0]]['ansible_host'] }}"
        state: present

    - name: Configure check commands in nrpe.cfg
      ansible.builtin.blockinfile:
        path: /etc/nagios/nrpe.cfg
        marker: "# {mark} ANSIBLE MANAGED LEDGER AI CHECKS"
        block: |
          command[check_cpu]=/usr/lib/nagios/plugins/check_load -r -w 4.0,3.5,3.0 -c 6.0,5.0,4.0
          command[check_mem]=/usr/local/bin/check_mem.sh -w 80 -c 90
          command[check_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
          command[check_pm2]=/usr/local/bin/check_pm2.sh ledger-ai

    - name: Restart and enable nagios-nrpe-server service
      ansible.builtin.systemd:
        name: nagios-nrpe-server
        state: restarted
        enabled: true


# --- Part 2: Register Ledger App Server in Nagios Core Engine ---
- name: "Register Ledger App Host and Services on Nagios Server"
  hosts: monitoring_servers
  become: true

  tasks:
    - name: Ensure check_nrpe command is registered in Nagios commands.cfg
      ansible.builtin.blockinfile:
        path: /usr/local/nagios/etc/objects/commands.cfg
        marker: "# {mark} ANSIBLE MANAGED NRPE COMMAND"
        block: |
          define command {
              command_name    check_nrpe
              command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
          }

    - name: Deploy Ledger App Host & Service Definitions
      ansible.builtin.template:
        src: ../templates/ledger_app_host.cfg.j2
        dest: /usr/local/nagios/etc/servers/ledger_app.cfg
        owner: nagios
        group: nagios
        mode: "0644"

    - name: Deploy Vercel Production Monitoring Definitions
      ansible.builtin.template:
        src: ../templates/vercel_host.cfg.j2
        dest: /usr/local/nagios/etc/servers/vercel.cfg
        owner: nagios
        group: nagios
        mode: "0644"

    - name: Verify Nagios configuration integrity
      ansible.builtin.command: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
      changed_when: false

    - name: Reload Nagios service with new checks
      ansible.builtin.systemd:
        name: nagios
        state: reloaded

    - name: Monitoring Deployment Summary
      ansible.builtin.debug:
        msg: "All 6 metrics (CPU, RAM, Disk, SSH, HTTP, PM2) are actively registered and monitored in Nagios!"

