---
- name: "Chaos Engineering: Simulate Failures on Ledger AI Application Server"
  hosts: app_servers
  become: true
  vars:
    # Default scenario: 'all' (or specify: 'pm2', 'nginx', 'cpu')
    scenario: "pm2"
    app_user: "ubuntu"
    app_name: "ledger-ai"

  tasks:
    - name: Display Selected Chaos Scenario
      ansible.builtin.debug:
        msg: "Simulating failure scenario: '{{ scenario }}' on host {{ inventory_hostname }}"

    # --- Scenario 1: Crash PM2 Application Process ---
    - name: "[Chaos Scenario 1] Stop PM2 Process: {{ app_name }}"
      when: scenario in ['pm2', 'all']
      block:
        - name: Stop PM2 process via CLI
          ansible.builtin.command: pm2 stop {{ app_name }}
          become_user: "{{ app_user }}"
          environment:
            PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"

        - name: Verify PM2 process is stopped
          ansible.builtin.command: su - {{ app_user }} -c "pm2 list"
          register: pm2_status
          changed_when: false

        - name: Print PM2 Status
          ansible.builtin.debug:
            msg: "PM2 process '{{ app_name }}' has been forcefully stopped. Nagios alert will transition to CRITICAL!"

    # --- Scenario 2: Crash Nginx Web Server ---
    - name: "[Chaos Scenario 2] Stop Nginx Web Server"
      when: scenario in ['nginx', 'all']
      block:
        - name: Forcefully stop nginx service
          ansible.builtin.systemd:
            name: nginx
            state: stopped

        - name: Print Nginx Status
          ansible.builtin.debug:
            msg: "Nginx web server has been stopped. Port 80 HTTP checks will immediately report CRITICAL in Nagios!"

    # --- Scenario 3: High CPU Stress Spike ---
    - name: "[Chaos Scenario 3] Generate Synthetic CPU Stress Spike"
      when: scenario in ['cpu', 'all']
      block:
        - name: Ensure stress-ng is installed
          ansible.builtin.apt:
            name: stress-ng
            state: present

        - name: Launch synthetic 100% CPU load for 120 seconds in background
          ansible.builtin.command: stress-ng --cpu 2 --timeout 120s --daemon
          changed_when: true

        - name: Print CPU Stress Status
          ansible.builtin.debug:
            msg: "Synthetic CPU stress running for 120s. Nagios 'CPU Load Average' check will trigger WARNING/CRITICAL!"

    - name: Failure Simulation Complete
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "Failure successfully injected into {{ inventory_hostname }}!"
          - "Check your Nagios Dashboard: http://<NAGIOS_IP>/nagios"
          - "Observe the status change from OK to WARNING / CRITICAL."
          - "To restore healthy state, run: playbooks/06_recovery_service.yml"
          - "=========================================================="

